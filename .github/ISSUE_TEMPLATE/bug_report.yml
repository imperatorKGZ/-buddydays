name: Bug report
description: Report a reproducible problem with BuddyDays.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the route, viewport, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
